name: Publish Wails v3 Linux-Windows Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:
    inputs:
      go_version:
        description: 'Go version to bake into the image'
        required: false
        default: '1.26.0'
      node_major:
        description: 'Node.js major version'
        required: false
        default: '20'
      wails_version:
        description: 'Wails v3 CLI version'
        required: false
        default: 'v3.0.0'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GO_VER="${{ github.event.inputs.go_version || '1.26.0' }}"
          NODE_VER="${{ github.event.inputs.node_major || '20' }}"
          WAILS_VER="${{ github.event.inputs.wails_version || 'v3.0.0' }}"
          IMAGE="ghcr.io/${OWNER}/wails3-linux-windows"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "go_ver=${GO_VER}" >> "$GITHUB_OUTPUT"
          echo "node_ver=${NODE_VER}" >> "$GITHUB_OUTPUT"
          echo "wails_ver=${WAILS_VER}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:latest,${IMAGE}:go${GO_VER}-${WAILS_VER}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GO_VERSION=${{ steps.meta.outputs.go_ver }}
            NODE_MAJOR=${{ steps.meta.outputs.node_ver }}
            WAILS_VERSION=${{ steps.meta.outputs.wails_ver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
